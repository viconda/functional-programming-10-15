name: Проверки лабораторных работ

on: [push, pull_request]

jobs:
  early-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyrsistent==0.20.0 reactivex==4.1.0
      - run: python -m lab10.main
      - run: python -m lab11.demo
      - run: python -m lab12.main
      - run: python -m unittest lab11.test_mini lab12.test_rx -v

  modular-labs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: lab13
            package: analytics
          - folder: lab14
            package: schedule
          - folder: lab15
            package: shop
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest --cov=${{ matrix.package }} --cov-report=term-missing
      - run: python -m ruff check src tests
      - run: python -m mypy src/${{ matrix.package }}
